services:
  web:
    image: novi-landing:local

    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:?NEXT_PUBLIC_BOOKING_URL must be set}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - caddy_data:/data
      - caddy_config:/config

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy_data:
  caddy_config:
